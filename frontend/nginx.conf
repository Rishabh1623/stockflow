server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router owns all client-side paths (e.g.
    # /warehouses/1), which don't correspond to real files on disk. Without
    # this, a hard refresh or a direct link to that URL would 404 at nginx
    # before React Router ever gets a chance to handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
