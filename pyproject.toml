[project]
name = "stockflow-api"
version = "0.1.0"
description = "StockFlow supply chain visibility platform — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends(...) as a default arg is the idiomatic pattern

[tool.pytest.ini_options]
asyncio_mode = "auto"
# test_engine in conftest.py is a session-scoped singleton; asyncpg connections
# are bound to the loop that created them, so fixtures/tests must share one loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
